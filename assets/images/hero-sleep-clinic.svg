<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="40%" stop-color="#101838"/>
      <stop offset="100%" stop-color="#18234D"/>
    </linearGradient>
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E4EAF7"/>
      <stop offset="100%" stop-color="#C4CCDF"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B5BDB" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7A9BE8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B5BDB" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Suite Architectural Background -->
  <rect width="800" height="600" fill="url(#suiteBg)" rx="24"/>

  <!-- Subtle Circadian Horizon Light / Ambient Wall Wash -->
  <circle cx="480" cy="180" r="280" fill="#3B5BDB" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="240" cy="120" r="180" fill="#7A9BE8" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Interior Architectural Lines (Perspective Grid) -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#1A244D" stroke-width="1.5"/>
  <line x1="140" y1="0" x2="140" y2="460" stroke="#1A244D" stroke-width="1" opacity="0.6"/>
  <line x1="680" y1="0" x2="680" y2="460" stroke="#1A244D" stroke-width="1" opacity="0.6"/>

  <!-- Architectural Window / Acoustic Soft Wall Panel -->
  <rect x="520" y="60" width="200" height="280" rx="16" fill="#0C1433" stroke="#253268" stroke-width="1.5"/>
  <line x1="620" y1="60" x2="620" y2="340" stroke="#253268" stroke-width="1" opacity="0.7"/>
  <line x1="520" y1="200" x2="720" y2="200" stroke="#253268" stroke-width="1" opacity="0.7"/>

  <!-- Restful Clinical Study Bed Structure -->
  <!-- Headboard -->
  <rect x="80" y="240" width="360" height="180" rx="18" fill="#141E42" stroke="#2A3970" stroke-width="1.5"/>
  <!-- Pillows -->
  <rect x="110" y="270" width="130" height="65" rx="14" fill="#E4EAF7" stroke="#C4CCDF" stroke-width="1"/>
  <rect x="260" y="270" width="140" height="65" rx="14" fill="#EDF2FB" stroke="#C4CCDF" stroke-width="1"/>
  <!-- Mattress / Linens -->
  <path d="M70 340 Q 250 325 460 340 L 460 480 Q 250 495 70 480 Z" fill="url(#bedGrad)" stroke="#B8C4DC" stroke-width="1.5"/>
  <!-- Folded Duvet Accent Line -->
  <path d="M70 380 Q 250 368 460 380" stroke="#3B5BDB" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Bedside Telemetry Diagnostics Station -->
  <rect x="500" y="240" width="240" height="170" rx="16" fill="#111B3D" stroke="#2D3C75" stroke-width="1.5"/>
  <!-- Screen Frame -->
  <rect x="515" y="255" width="210" height="140" rx="10" fill="url(#screenGrad)" stroke="#3A4D8F" stroke-width="1"/>

  <!-- Telemetry Live Waveforms (EEG, SpO2, Respiratory Airflow) -->
  <!-- Waveform 1: Delta Sleep EEG -->
  <path d="M525 290 Q 545 275 565 290 T 605 290 T 645 282 T 685 298 T 715 290" fill="none" stroke="#7A9BE8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Waveform 2: Airflow Rhythm -->
  <path d="M525 325 C 545 305, 565 345, 585 325 C 605 305, 625 345, 645 325 C 665 305, 685 345, 715 325" fill="none" stroke="#53C8B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Waveform 3: SpO2 Pulse Plethysmogram -->
  <path d="M525 365 L 560 365 L 568 348 L 576 372 L 584 365 L 620 365 L 628 348 L 636 372 L 644 365 L 715 365" fill="none" stroke="#48BB78" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Status Badges on Monitor -->
  <circle cx="535" cy="272" r="4" fill="#48BB78"/>
  <text x="546" y="275" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#EEF0FA" letter-spacing="0.5">POLYSOMNOGRAPHY MONITORING</text>
  <text x="680" y="275" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#7A9BE8">ACTIVE</text>

  <!-- Clinical Floating Metric Pill (Human Touch) -->
  <g transform="translate(60, 150)">
    <rect width="210" height="64" rx="32" fill="#0D1638" stroke="#35498A" stroke-width="1.5" opacity="0.95"/>
    <circle cx="34" cy="32" r="18" fill="#3B5BDB" opacity="0.25"/>
    <circle cx="34" cy="32" r="8" fill="#7A9BE8"/>
    <text x="64" y="26" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#7A9BE8" letter-spacing="1">POLYSOMNOGRAM</text>
    <text x="64" y="44" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Full Sleep Stage Scoring</text>
  </g>

  <!-- Ambient Light Reflection Floor -->
  <ellipse cx="400" cy="540" rx="340" ry="25" fill="#3B5BDB" opacity="0.08" filter="url(#softGlow)"/>
</svg>
