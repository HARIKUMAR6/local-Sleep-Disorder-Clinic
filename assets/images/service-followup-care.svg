<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="followupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1E" />
      <stop offset="60%" stop-color="#0D1537" />
      <stop offset="100%" stop-color="#162354" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DABF7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B5BDB" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#followupBg)" rx="16"/>

  <!-- Telemetry Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="100" x2="720" y2="100" />
    <line x1="80" y1="200" x2="720" y2="200" />
    <line x1="80" y1="300" x2="720" y2="300" />
    <line x1="80" y1="400" x2="720" y2="400" />
    <line x1="80" y1="500" x2="720" y2="500" />
    <line x1="160" y1="60" x2="160" y2="540" />
    <line x1="320" y1="60" x2="320" y2="540" />
    <line x1="480" y1="60" x2="480" y2="540" />
    <line x1="640" y1="60" x2="640" y2="540" />
  </g>

  <!-- Longitudinal Progress Area Chart -->
  <path d="M 120,400 L 220,360 L 320,380 L 420,290 L 520,260 L 620,180 L 680,160 L 680,480 L 120,480 Z" fill="url(#chartGrad)" />
  <path d="M 120,400 L 220,360 L 320,380 L 420,290 L 520,260 L 620,180 L 680,160" fill="none" stroke="#4DABF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data checkpoints -->
  <circle cx="120" cy="400" r="5" fill="#3B5BDB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="220" cy="360" r="5" fill="#3B5BDB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="320" cy="380" r="5" fill="#3B5BDB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="420" cy="290" r="5" fill="#3B5BDB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="520" cy="260" r="5" fill="#3B5BDB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="620" cy="180" r="6" fill="#7A9BE8" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="680" cy="160" r="6" fill="#4DABF7" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Milestone Cards -->
  <g transform="translate(100, 100)">
    <rect width="250" height="76" rx="10" fill="#0B132E" stroke="#25356B" stroke-width="1.2" />
    <text x="20" y="28" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#7A9BE8" letter-spacing="0.5">CONTINUOUS CARE</text>
    <text x="20" y="52" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">30, 60 &amp; 90-Day Reviews</text>
  </g>

  <g transform="translate(480, 240)">
    <rect width="240" height="84" rx="10" fill="#0D1739" stroke="#3B5BDB" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="30" cy="36" r="12" fill="#3B5BDB" fill-opacity="0.3" stroke="#7A9BE8" stroke-width="1.5" />
    <path d="M 26,36 L 29,39 L 35,32" fill="none" stroke="#7A9BE8" stroke-width="1.8" stroke-linecap="round" />
    <text x="52" y="32" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#A4B3D6">COMPLIANCE OPTIMIZATION</text>
    <text x="52" y="54" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Therapy Adherence Tracking</text>
    <text x="20" y="72" font-family="'DM Sans', sans-serif" font-size="11" fill="#7A9BE8">AASM Standard Adherence Protocols</text>
  </g>
</svg>
