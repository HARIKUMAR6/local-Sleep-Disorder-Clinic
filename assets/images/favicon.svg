<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      :root {
        --bg-color: #0B1528;
        --border-color: #1E2D4A;
        --icon-color: #3B5BDB;
        --accent-color: #7A9BE8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #000000;
          --border-color: #1A2242;
          --icon-color: #7A9BE8;
          --accent-color: #A5BFF5;
        }
      }
      .brand-bg {
        fill: var(--bg-color);
        stroke: var(--border-color);
        stroke-width: 14px;
      }
      .brand-ribbon {
        stroke: var(--icon-color);
        stroke-width: 28px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .brand-node {
        fill: var(--accent-color);
      }
    </style>
  </defs>
  <!-- SomnaClinic Luxury Background: Circular midnight container with subtle rim -->
  <rect class="brand-bg" x="12" y="12" width="488" height="488" rx="140" ry="140" />
  <!-- The Somna Circadian Ribbon: Scale from 44x44 to 512x512 -->
  <g transform="translate(68, 68) scale(8.55)">
    <path class="brand-ribbon" d="M12 28C10 24 10 18 15 13C20 8 28 8 33 13C36 16 36.5 20 35 23.5C33 28 27.5 29 23 27C18.5 25 15 26 13 29C11 32 12 36 16 38C21 40 27 38 31 34" />
    <circle class="brand-node" cx="28" cy="17.5" r="2.8" />
  </g>
</svg>
