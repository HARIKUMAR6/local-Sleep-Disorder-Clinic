<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      :root {
        --bg-color: #176B63;
        --border-color: #0F514B;
        --icon-color: #FFFFFF;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #141414;
          --border-color: #292D2B;
          --icon-color: #65B8AD;
        }
      }
      .brand-bg {
        fill: var(--bg-color);
        stroke: var(--border-color);
        stroke-width: 14px;
      }
      .brand-icon {
        fill: var(--icon-color);
      }
    </style>
