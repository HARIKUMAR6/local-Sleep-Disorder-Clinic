<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="insomniaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D21" />
      <stop offset="50%" stop-color="#0E163B" />
      <stop offset="100%" stop-color="#141F4D" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="65%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#7A9BE8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#3B5BDB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080D21" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B5BDB" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7A9BE8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4DABF7" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#insomniaBg)" rx="16"/>
  <rect width="800" height="600" fill="url(#moonGlow)" rx="16"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="120" x2="740" y2="120" />
    <line x1="60" y1="240" x2="740" y2="240" />
    <line x1="60" y1="360" x2="740" y2="360" />
    <line x1="60" y1="480" x2="740" y2="480" />
    <line x1="200" y1="60" x2="200" y2="540" />
    <line x1="400" y1="60" x2="400" y2="540" />
    <line x1="600" y1="60" x2="600" y2="540" />
  </g>

  <!-- Circadian Moon / Cognitive Calm Symbol -->
  <circle cx="520" cy="220" r="110" fill="#0D1636" stroke="#7A9BE8" stroke-opacity="0.4" stroke-width="2" />
  <circle cx="550" cy="195" r="95" fill="#080D21" />
  <circle cx="520" cy="220" r="125" fill="none" stroke="#3B5BDB" stroke-opacity="0.2" stroke-dasharray="4,6" stroke-width="1.5" />
  
  <!-- Neuro Sleep Waveforms (CBT-I Cognitive Relaxation) -->
  <path d="M 80,420 C 140,420 170,360 230,360 C 290,360 320,440 380,440 C 440,440 480,390 540,390 C 600,390 640,410 720,410" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 80,450 C 150,450 190,410 250,410 C 310,410 340,470 410,470 C 480,470 510,430 580,430 C 650,430 680,445 720,445" fill="none" stroke="#7A9BE8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="2,4" />

  <!-- Cognitive Protocol Interface Cards -->
  <g transform="translate(100, 140)">
    <rect width="260" height="150" rx="12" fill="#0B132E" stroke="#25356B" stroke-width="1.5" opacity="0.95" />
    <circle cx="28" cy="32" r="10" fill="#3B5BDB" fill-opacity="0.2" stroke="#7A9BE8" stroke-width="1.5" />
    <path d="M 24,32 L 27,35 L 32,29" fill="none" stroke="#7A9BE8" stroke-width="1.5" stroke-linecap="round" />
    <text x="48" y="36" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#F0F3FB" letter-spacing="0.5">CBT-I PROTOCOL ACTIVE</text>
    <text x="24" y="70" font-family="'DM Sans', sans-serif" font-size="12" fill="#A4B3D6">Sleep Consolidation</text>
    <rect x="24" y="80" width="212" height="6" rx="3" fill="#172247" />
    <rect x="24" y="80" width="168" height="6" rx="3" fill="#4DABF7" />
    
    <text x="24" y="112" font-family="'DM Sans', sans-serif" font-size="12" fill="#A4B3D6">Circadian Alignment</text>
    <rect x="24" y="122" width="212" height="6" rx="3" fill="#172247" />
    <rect x="24" y="122" width="186" height="6" rx="3" fill="#7A9BE8" />
  </g>

  <!-- Behavioral Telemetry Badge -->
  <g transform="translate(420, 370)">
    <rect width="250" height="70" rx="10" fill="#0E1738" stroke="#3B5BDB" stroke-opacity="0.5" stroke-width="1" />
    <text x="20" y="30" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#7A9BE8" letter-spacing="0.8">NON-PHARMACOLOGIC</text>
    <text x="20" y="52" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Evidence-Based Sleep Therapy</text>
  </g>
</svg>
