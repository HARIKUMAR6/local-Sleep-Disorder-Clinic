<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="introBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E26"/>
      <stop offset="60%" stop-color="#121C45"/>
      <stop offset="100%" stop-color="#1A285E"/>
    </linearGradient>
    <linearGradient id="circadianArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="50%" stop-color="#7A9BE8"/>
      <stop offset="100%" stop-color="#48BB78"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="700" height="500" rx="20" fill="url(#introBg)"/>

  <!-- Circadian 24-Hour Orbital Arc -->
  <circle cx="350" cy="270" r="160" fill="none" stroke="#213063" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M190 270 A 160 160 0 0 1 510 270" fill="none" stroke="url(#circadianArc)" stroke-width="4" stroke-linecap="round"/>

  <!-- Nocturnal restorative zone -->
  <path d="M230 270 A 120 120 0 0 1 470 270" fill="#3B5BDB" opacity="0.12"/>

  <!-- Core Circadian Nodes -->
  <!-- Night / Melatonin Peak Node -->
  <g transform="translate(350, 110)">
    <circle cx="0" cy="0" r="28" fill="#141E47" stroke="#7A9BE8" stroke-width="2" filter="url(#glow)"/>
    <path d="M-6 -8 A 12 12 0 0 0 6 8 A 12 12 0 1 1 -6 -8 Z" fill="#7A9BE8"/>
    <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#EEF0FA" text-anchor="middle">Deep Restorative Sleep</text>
    <text x="0" y="58" font-family="'DM Sans', sans-serif" font-size="9" fill="#9AA3C8" text-anchor="middle">Slow-Wave Delta &amp; REM</text>
  </g>

  <!-- Left Node: Onset / Wind-down -->
  <g transform="translate(200, 240)">
    <circle cx="0" cy="0" r="18" fill="#111B40" stroke="#3B5BDB" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#3B5BDB"/>
    <text x="0" y="30" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#EEF0FA" text-anchor="middle">Sleep Latency</text>
  </g>

  <!-- Right Node: Awakening & Alertness -->
  <g transform="translate(500, 240)">
    <circle cx="0" cy="0" r="18" fill="#111B40" stroke="#48BB78" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#48BB78"/>
    <text x="0" y="30" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#EEF0FA" text-anchor="middle">Cortisol Rhythm</text>
  </g>

  <!-- Physiological Waveform (EEG Sleep Spindles) -->
  <path d="M120 400 L 220 400 L 235 385 L 245 415 L 255 380 L 265 420 L 275 390 L 285 410 L 295 400 L 400 400 L 415 375 L 430 425 L 445 385 L 460 415 L 475 400 L 580 400" 
        fill="none" stroke="#7A9BE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Clinical Explanatory Badge -->
  <g transform="translate(40, 40)">
    <rect width="180" height="38" rx="19" fill="#0C1438" stroke="#2C3B7A" stroke-width="1"/>
    <text x="90" y="24" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#7A9BE8" text-anchor="middle" letter-spacing="0.5">CIRCADIAN ARCHITECTURE</text>
  </g>
</svg>
